<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snapstakes — Enter one frame. Judge three. Climb the aperture.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120F; --ink-2:#1D1915; --ink-3:#241F19;
    --safelight:#C7402C; --safelight-2:#E0553D;
    --paper:#EFE8DA; --paper-dim:#C9BFA9; --gold:#C1A06B; --fog:#948C7C;
    --line:rgba(239,232,218,0.12); --line-strong:rgba(239,232,218,0.22);
    --serif:'Fraunces',serif; --sans:'Public Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--safelight);color:var(--paper)}

  .shell{max-width:1100px;margin:0 auto;padding:0 24px}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;
       border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(21,18,15,.92);
       backdrop-filter:blur(8px);z-index:50}
  .brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .brand-mark{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold);position:relative}
  .brand-mark::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:var(--safelight)}
  .nav-links{display:flex;gap:26px}
  .nav-links button{background:none;border:none;color:var(--fog);font-size:14px;padding:6px 0;
       border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
  .nav-links button.active,.nav-links button:hover{color:var(--paper);border-color:var(--gold)}

  .view{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--safelight-2);margin-bottom:10px;display:block}
  h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.08;letter-spacing:-.5px}
  h2{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.3px}
  h3{font-family:var(--serif);font-weight:500;font-size:19px}
  p{color:var(--paper-dim);line-height:1.6;font-size:15px}
  .lede{font-size:17px;max-width:530px}

  .btn{border-radius:2px;padding:13px 22px;font-size:14px;font-weight:600;border:1px solid transparent;
       transition:all .15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--safelight);color:var(--paper)}
  .btn-primary:hover{background:var(--safelight-2)}
  .btn-primary:disabled{background:#5c443d;color:#8c7d75;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--paper);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .btn-gold{background:var(--gold);color:var(--ink)}
  .btn-gold:hover{background:#d4b47f}
  .btn-block{width:100%;justify-content:center}
  .btn-sm{padding:8px 14px;font-size:12px}

  .marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
     padding:22px 0;background:var(--ink-2);
     mask-image:linear-gradient(90deg,transparent,black 6%,black 94%,transparent)}
  .marquee-track{display:flex;gap:18px;width:max-content;animation:scroll-left 56s linear infinite}
  .marquee:hover .marquee-track{animation-play-state:paused}
  @keyframes scroll-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .frame{width:150px;flex-shrink:0;background:var(--paper);padding:8px 8px 12px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .frame img{width:100%;height:186px;object-fit:cover}
  .frame-cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
  .frame-cap .fstop{font-family:var(--mono);font-size:11px;color:var(--safelight);font-weight:600}
  .frame-cap .amt{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:600}
  .frame-handle{font-family:var(--mono);font-size:9.5px;color:#6b6558;margin-top:2px}

  .hero{padding:56px 0 44px}
  .hero-cta{display:flex;gap:12px;margin-top:26px;align-items:center;flex-wrap:wrap}
  .hero-note{font-family:var(--mono);font-size:12px;color:var(--fog);margin-top:14px}

  .section{padding:56px 0;border-top:1px solid var(--line)}
  .section-head{margin-bottom:34px;max-width:600px}
  .ladder{display:flex;overflow-x:auto;padding-bottom:8px}
  .rung{flex:1 0 130px;text-align:center;position:relative;padding:0 6px}
  .rung::before{content:'';position:absolute;top:19px;left:-50%;width:100%;height:1px;background:var(--line-strong)}
  .rung:first-child::before{display:none}
  .rung-dot{width:9px;height:9px;border-radius:50%;background:var(--ink);border:1.5px solid var(--gold);margin:0 auto 14px;position:relative;z-index:2}
  .rung.current .rung-dot{background:var(--safelight);border-color:var(--safelight);box-shadow:0 0 0 5px rgba(199,64,44,.18)}
  .rung-fstop{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .rung-amt{font-family:var(--serif);font-size:21px;margin-top:6px}
  .rung-label{font-family:var(--mono);font-size:10px;color:var(--fog);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .ladder-note{margin-top:22px;font-size:13px;color:var(--fog);font-family:var(--mono)}

  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .step{border-top:1px solid var(--line-strong);padding-top:16px}
  .step-num{font-family:var(--mono);color:var(--safelight-2);font-size:13px;margin-bottom:10px;display:block}

  .card{background:var(--ink-2);border:1px solid var(--line);padding:28px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .upload-zone{border:1.5px dashed var(--line-strong);padding:36px 20px;text-align:center;
      transition:border-color .15s;cursor:pointer;position:relative;overflow:hidden;display:block}
  .upload-zone:hover{border-color:var(--gold)}
  .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-preview{width:100%;aspect-ratio:3/4;object-fit:cover}
  .field-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .field-row:last-of-type{border-bottom:none}
  .field-row .v{font-family:var(--mono);color:var(--paper)}
  .price-tag{font-family:var(--mono);color:var(--gold);font-size:20px}

  .wait-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:32px 0}
  .wait-slot{aspect-ratio:3/4;border:1px dashed var(--line-strong);display:flex;align-items:center;
      justify-content:center;position:relative;overflow:hidden;background:var(--ink-2)}
  .wait-slot img{width:100%;height:100%;object-fit:cover;opacity:0;animation:fadein .5s ease forwards}
  @keyframes fadein{to{opacity:1}}
  .wait-slot .tag{position:absolute;bottom:6px;left:6px;font-family:var(--mono);font-size:10px;background:rgba(21,18,15,.75);padding:2px 6px}
  .wait-slot .pulse{width:8px;height:8px;border-radius:50%;background:var(--fog);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
  .wait-status{font-family:var(--mono);font-size:13px;color:var(--fog);text-align:center}

  .judge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
  .judge-photo{position:relative;cursor:pointer;border:2px solid var(--line);overflow:hidden;transition:border-color .15s,transform .15s}
  .judge-photo:hover{border-color:var(--gold);transform:translateY(-2px)}
  .judge-photo.ranked{border-color:var(--safelight)}
  .judge-photo img{width:100%;aspect-ratio:3/4;object-fit:cover}
  .rank-badge{position:absolute;top:10px;left:10px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;
      background:var(--safelight);color:var(--paper);font-family:var(--mono);font-weight:600;
      display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .rank-hint{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:10px;color:var(--fog);background:rgba(21,18,15,.7);padding:3px 7px}

  .results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:28px 0}
  .result-card{border:1px solid var(--line);padding:12px;background:var(--ink-2);position:relative}
  .result-card.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .result-card.tied{border-color:var(--safelight);box-shadow:0 0 0 1px var(--safelight) inset}
  .result-card.dropped{opacity:.5}
  .result-card img{width:100%;aspect-ratio:3/4;object-fit:cover;margin-bottom:10px}
  .result-name{font-family:var(--mono);font-size:11.5px;color:var(--fog);display:flex;justify-content:space-between;gap:4px}
  .crown{color:var(--gold)}
  .tiemark{color:var(--safelight-2)}
  .score-track{height:5px;background:var(--ink-3);margin-top:8px;overflow:hidden}
  .score-fill{height:100%;background:var(--safelight);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .score-num{font-family:var(--mono);font-size:14px;margin-top:6px;color:var(--paper)}
  .score-sub{font-family:var(--mono);font-size:10px;color:var(--fog);margin-top:2px}

  .pot-row{display:flex;justify-content:space-between;padding:9px 0;font-family:var(--mono);font-size:14px;border-bottom:1px solid var(--line)}
  .pot-row:last-child{border-bottom:none;padding-top:14px;font-size:17px;color:var(--gold)}
  .pot-row .neg{color:var(--safelight-2)}
  .pot-row.sub{font-size:12.5px;color:var(--fog)}

  .decision-panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .decision-card{border:1px solid var(--line-strong);padding:22px}
  .decision-card .amt{font-family:var(--serif);font-size:30px;margin:10px 0 6px}

  .void-banner{border:1px solid var(--safelight);background:rgba(199,64,44,.08);padding:22px;margin-top:26px}
  .void-banner h3{color:var(--paper);margin-bottom:8px}

  .history-list{margin-top:24px;border-top:1px solid var(--line)}
  .history-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .history-row img{width:52px;height:68px;object-fit:cover}
  .history-meta{flex:1}
  .history-meta .t2{font-family:var(--mono);font-size:11px;color:var(--fog);margin-top:3px}
  .history-amt{font-family:var(--mono);font-size:16px;color:var(--gold)}
  .history-amt.void{color:var(--fog)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--fog);font-family:var(--mono);font-size:13px;border:1px dashed var(--line-strong)}
  .stat-row{display:flex;gap:36px;margin:24px 0 8px;flex-wrap:wrap}
  .stat .n{font-family:var(--serif);font-size:30px}
  .stat .l{font-family:var(--mono);font-size:10.5px;color:var(--fog);text-transform:uppercase;letter-spacing:1px}

  .notice{border-left:2px solid var(--gold);padding:14px 16px;background:var(--ink-3);margin-top:20px;
      font-family:var(--mono);font-size:12px;color:var(--paper-dim);line-height:1.75}
  .checksum{font-family:var(--mono);font-size:11px;color:var(--fog);margin-top:14px;text-align:right}
  .checksum.bad{color:var(--safelight-2)}
  .devbar{border:1px dashed var(--line-strong);padding:14px 16px;margin-top:26px;
      font-family:var(--mono);font-size:11.5px;color:var(--fog);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .foot{text-align:center;padding:40px 24px 60px;font-family:var(--mono);font-size:11.5px;color:var(--fog);border-top:1px solid var(--line)}
  .foot span{color:var(--gold)}

  @media (max-width:820px){
    h1{font-size:32px}
    .two-col,.decision-panel{grid-template-columns:1fr}
    .steps{grid-template-columns:1fr 1fr}
    .judge-grid{grid-template-columns:1fr}
    .results-grid,.wait-grid{grid-template-columns:1fr 1fr}
    .rung::before{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================ CONFIG ============================
   v3.1 — INTEGER SCORING.

   The design intent is the unit fractions 1, 1/3, 1/5. Multiplying
   through by their LCM of 15 gives 15, 5, 3 — the identical ordering
   and identical ratios, in whole numbers.

   Why it matters: in v3 the two arms of a genuine tie evaluated to
   2.3333333333333335 and 2.333333333333333 — mathematically equal,
   one ULP apart in binary floating point. An exact === comparison
   would have silently declared a winner and skipped the void. With
   integers, === is exact and the settlement path has no floats in it.

   Derived constants:
     per-judge outlay  = 15 + 5 + 3        = 23  (identical every ballot)
     round total       = 23 x 4 judges     = 92  (invariant; asserted)
     max single score  = 15 x 3 judges     = 45  (a clean sweep)
     min single score  =  3 x 3 judges     =  9  (ranked last by all)
   ================================================================ */
const GROUP_SIZE  = 4;
const RAKE        = 0.25;
const RANK_POINTS = [15, 5, 3];                 // 1, 1/3, 1/5 scaled by LCM 15
const POINT_SCALE = 15;                         // divide by this to recover fractions
const JUDGES      = GROUP_SIZE - 1;             // judges scoring any one entrant
const MAX_SCORE   = RANK_POINTS[0] * JUDGES;    // 45
const MIN_SCORE   = RANK_POINTS[2] * JUDGES;    // 9
const ROUND_TOTAL = RANK_POINTS.reduce((a,b)=>a+b,0) * GROUP_SIZE;  // 92

const FSTOPS = ['f/1','f/1.4','f/2','f/2.8','f/4','f/5.6','f/8'];
const MAX_TIER = FSTOPS.length;

const stake     = t => Math.pow(3, t-1);
const grossPot  = t => GROUP_SIZE * stake(t);
const houseCut  = t => stake(t);
const netAmount = t => Math.pow(3, t);
const fmt = n => '$' + n.toLocaleString(undefined,{maximumFractionDigits:0});
const img = (s,w,h) => `https://picsum.photos/seed/${s}/${w||600}/${h||800}`;

/* exact fraction label for an integer score, e.g. 35 -> "2 1/3" */
function asFraction(pts){
  const whole = Math.floor(pts / POINT_SCALE);
  const rem   = pts % POINT_SCALE;
  if(rem === 0) return String(whole);
  const g = (a,b)=> b ? g(b,a%b) : a;
  const d = g(rem, POINT_SCALE);
  const frac = `${rem/d}/${POINT_SCALE/d}`;
  return whole ? `${whole} ${frac}` : frac;
}

const HALL_OF_FAME = [
  {seed:'aurora-peak',tier:6,handle:'@mireille.k'},{seed:'glass-market',tier:5,handle:'@denpork'},
  {seed:'kite-festival',tier:6,handle:'@noor.frames'},{seed:'harbor-fog',tier:5,handle:'@saltlens'},
  {seed:'red-door',tier:4,handle:'@arlo.codes'},{seed:'night-tram',tier:4,handle:'@vk.photo'},
  {seed:'copper-roofs',tier:5,handle:'@teo.light'},{seed:'desert-bloom',tier:3,handle:'@ines.raw'},
  {seed:'wheat-horizon',tier:6,handle:'@finch.exp'},{seed:'lantern-alley',tier:4,handle:'@moth.eye'},
];
const SEEDS = ['fern-window','tide-pool','market-steam','neon-alley','wheat-field','paper-lanterns',
  'iron-bridge','moth-light','salt-flat','citrus-stall','foundry-spark','glacier-blue','quiet-platform',
  'ink-rain','terrace-cats','violet-hour','brick-stairwell','dune-line','string-lights','copper-kettle'];
const HANDLES = ['@lior.frames','@yuna.exposes','@caz_negative','@petra.grain','@obi.develops',
  '@mina.shutter','@ren.contrast','@aiko.silver','@theo.f8','@nadia.iso'];

/* ============================ STATE ============================ */
const state = {
  view:'home', tier:1,
  player:{id:'you',photo:null,handle:'@you'},
  group:[], judging:{ranks:{}}, results:null,
  history:[], hallAdds:[],
  excludeIds:[], voidStreak:0, forceTie:null,
};
function setView(v){ state.view=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function makeOpponents(n, exclude){
  const barred = new Set(exclude||[]);
  const pool = SEEDS.filter(s=>!barred.has('opp-'+s)).sort(()=>Math.random()-0.5).slice(0,n);
  const hs = [...HANDLES].sort(()=>Math.random()-0.5);
  return pool.map((s,i)=>({id:'opp-'+s, photo:img(s,600,800), handle:hs[i%hs.length]}));
}

/* ============================ SCORING ============================
   All arithmetic below is integer. No floats touch a score or a
   tie comparison.                                                  */
function tallyRound(group, playerRanks, force){
  const ids = group.map(m=>m.id);
  const ballots = {};

  if(force === '2way'){
    const o = ids;                                   // ties o[0] and o[1] at 35
    ballots[o[0]] = [o[1],o[2],o[3]];
    ballots[o[1]] = [o[0],o[2],o[3]];
    ballots[o[2]] = [o[0],o[1],o[3]];
    ballots[o[3]] = [o[1],o[0],o[2]];
  } else if(force === '4way'){
    ids.forEach((id,i)=>{ ballots[id] = [ids[(i+1)%4], ids[(i+2)%4], ids[(i+3)%4]]; });
  } else {
    ballots['you'] = Object.entries(playerRanks).sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
    group.filter(m=>m.id!=='you').forEach(j=>{
      ballots[j.id] = ids.filter(id=>id!==j.id).sort(()=>Math.random()-0.5);
    });
  }

  const s = {}; ids.forEach(id=>s[id]=0);
  Object.values(ballots).forEach(order=>{
    order.forEach((id,pos)=>{ s[id] += RANK_POINTS[pos]; });   // integer addition only
  });

  // integrity check: every ballot spends exactly 23, so the round must total 92
  const total = ids.reduce((a,id)=>a+s[id], 0);
  const balanced = total === ROUND_TOTAL;

  const scored = group.map(m=>({...m, score:s[m.id]})).sort((a,b)=>b.score-a.score);
  const top = scored[0].score;
  const tiedIds = scored.filter(x=>x.score === top).map(x=>x.id);   // exact ===, no epsilon

  return {
    scored, tiedIds, total, balanced,
    outcome: tiedIds.length===1 ? 'decided' : (tiedIds.length===GROUP_SIZE ? 'void4' : 'void2'),
    winnerId: tiedIds.length===1 ? tiedIds[0] : null,
  };
}

/* ============================ RENDER ============================ */
function render(){
  const nav = `<div class="nav">
    <div class="brand"><span class="brand-mark"></span>SNAPSTAKES</div>
    <div class="nav-links">${['home','entry','profile'].map(v=>{
      const l={home:'Home',entry:'Enter',profile:'My Snapstakes'}[v];
      return `<button class="${state.view===v?'active':''}" onclick="setView('${v}')">${l}</button>`;
    }).join('')}</div></div>`;
  const body = {home:homeView,entry:entryView,waiting:waitingView,
                judging:judgingView,results:resultsView,profile:profileView}[state.view]();
  document.getElementById('app').innerHTML = nav + `<div class="view">${body}</div>`;
  if(state.view==='waiting') runWaitingRoom();
  if(state.view==='results') requestAnimationFrame(()=>{
    document.querySelectorAll('.score-fill').forEach(el=>{
      setTimeout(()=>{ el.style.width = el.dataset.pct+'%'; },120);
    });
  });
}

function homeView(){
  const gal = HALL_OF_FAME.concat(state.hallAdds);
  const frames = gal.concat(gal).map(g=>`
    <div class="frame">
      <img src="${g.photo||img(g.seed,300,372)}" alt="Winning entry" loading="lazy"/>
      <div class="frame-cap"><span class="fstop">${FSTOPS[g.tier-1]}</span><span class="amt">${fmt(netAmount(g.tier))}</span></div>
      <div class="frame-handle">${g.handle}</div>
    </div>`).join('');

  const rungs = FSTOPS.map((f,i)=>`
    <div class="rung ${i===0?'current':''}">
      <div class="rung-dot"></div><div class="rung-fstop">${f}</div>
      <div class="rung-amt">${fmt(netAmount(i+1))}</div>
      <div class="rung-label">net to winner</div>
    </div>`).join('');

  const steps = [
    ['Enter','Pay $1, submit one photograph. You join a group of four entrants.'],
    ['Judge','Rank the other three frames — 1st, 2nd, 3rd. They rank yours the same way.'],
    ['Win or advance','Highest score takes the pot after the house share. Cash out, or push it up a stop.'],
    ['Repeat','Winners are grouped with winners. The pot triples. So does the pressure.'],
  ].map(([t,d],i)=>`<div class="step"><span class="step-num">0${i+1}</span><h3>${t}</h3><p>${d}</p></div>`).join('');

  return `
  <div class="marquee"><div class="marquee-track">${frames}</div></div>
  <div class="shell hero">
    <span class="eyebrow">Peer-judged photography contest</span>
    <h1>Enter one frame.<br>Judge three.<br>Climb the aperture.</h1>
    <p class="lede" style="margin-top:16px">Four entrants, one photograph each. You judge them, they judge you — no editors, no algorithm. Win your group and the pot is yours to keep or to risk again at the next stop.</p>
    <div class="hero-cta">
      <button class="btn btn-primary" onclick="setView('entry')">Enter contest — $1</button>
      <button class="btn btn-ghost" onclick="document.getElementById('ladder').scrollIntoView({behavior:'smooth'})">See the ladder</button>
    </div>
    <div class="hero-note">25% house share on every decided pot · a tie costs you nothing</div>
  </div>

  <div class="shell section" id="ladder">
    <div class="section-head">
      <span class="eyebrow">The aperture ladder</span>
      <h2>Every stop, the pot triples</h2>
      <p style="margin-top:10px">Four winners' pots merge, the house takes a quarter for upkeep, and the rest goes to whoever wins that round. Stop whenever you like — nothing forces you up the ladder.</p>
    </div>
    <div class="ladder">${rungs}</div>
    <div class="ladder-note">four $1 entries make a $4 pot · house takes $1 · winner nets $3 · and so on up</div>
  </div>

  <div class="shell section">
    <div class="section-head"><span class="eyebrow">How it works</span><h2>Four ways in, one way to climb</h2></div>
    <div class="steps">${steps}</div>
  </div>

  <div class="shell section">
    <div class="section-head">
      <span class="eyebrow">Scoring</span>
      <h2>Whole numbers, no rounding</h2>
      <p style="margin-top:10px">A 1st is worth <strong style="color:var(--paper)">15</strong> points, a 2nd <strong style="color:var(--paper)">5</strong>, a 3rd <strong style="color:var(--paper)">3</strong> — the whole-number form of 1, ⅓ and ⅕.</p>
    </div>
    <div class="notice">
      Every ballot spends exactly ${RANK_POINTS[0]} + ${RANK_POINTS[1]} + ${RANK_POINTS[2]} = 23 points, so a
      four-entrant round always distributes exactly ${ROUND_TOTAL}. A clean sweep scores ${MAX_SCORE}; last on
      every card scores ${MIN_SCORE}. Every published result shows the totals adding to ${ROUND_TOTAL}, so anyone can
      check a round by hand.
      <br><br>
      Scores are whole numbers end to end. Two entrants are level when their totals are equal — not
      approximately equal — so a tie is never missed and a winner is never invented by a rounding artefact.
    </div>
  </div>

  <div class="shell section">
    <div class="section-head">
      <span class="eyebrow">Ties</span>
      <h2>A tie doesn't cost you your climb</h2>
      <p style="margin-top:10px">Two photographs can finish level. When they do, the round is void and each entrant who tied gets a choice — replay the stop, or cash out on the spot — never against each other twice if they replay.</p>
    </div>
    <div class="notice">
      <strong style="color:var(--paper)">Two-way tie.</strong> The house takes both dropped entrants' stakes in
      full. Each tied entrant's own stake is untouched by the void, so it covers a re-entry precisely — no
      top-up, no shortfall. The house takes double what it takes on a decided round at the same stop.
      <br><br>
      <strong style="color:var(--paper)">Four-way tie.</strong> Rare, and there are no dropped entrants to fund
      anything, so the house voids the round outright. All four stakes are returned. The house absorbs it.
      <br><br>
      <strong style="color:var(--paper)">Three-way ties cannot happen.</strong> Not a rule — an arithmetic fact of
      ranking three photographs. Every tie is a pair or the whole group.
      <br><br>
      <strong style="color:var(--paper)">Replay or cash out.</strong> Whichever branch you land in, the money
      funding your position is exactly one stake at that stop. Replay and it re-enters as your stake; cash out
      and it's paid to you instead, ending the run there. Your accumulated prize never falls a stop because of a
      tie — you either play the level again or walk away with what you'd already won.
    </div>
  </div>

  <div class="foot">Snapstakes is a <span>demo prototype</span> — payments, opponents and payouts are simulated. No real money changes hands.</div>`;
}

function entryView(){
  const has = !!state.player.photo, t = state.tier;
  const retrying = state.voidStreak > 0;
  return `<div class="shell section" style="border-top:none;padding-top:44px">
    <span class="eyebrow">Tier ${t} · ${FSTOPS[t-1]}${retrying?' · replay':''}</span>
    <h2>${retrying?'Play the stop again':'Submit your entry'}</h2>
    <p style="margin-top:8px;max-width:480px">${retrying
      ? `Your ${fmt(stake(t))} stake carries over from the voided round. Same photograph, fresh opponents.`
      : `One photograph. Once the group of four is judging, it can't be swapped.`}</p>
    <div class="two-col" style="margin-top:30px">
      <div>
        <label class="upload-zone">
          ${has?`<img class="upload-preview" src="${state.player.photo}" alt="Your entry preview"/>`
               :`<div><h3 style="margin-bottom:8px">Drop a photograph here</h3><p>or click to browse — JPG or PNG</p></div>`}
          <input type="file" accept="image/*" onchange="handleUpload(event)"/>
        </label>
        <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="useSample()">Use a sample frame instead</button>
      </div>
      <div class="card">
        <div class="field-row"><span>${retrying?'Stake carried over':'Entry fee'}</span><span class="price-tag">${fmt(stake(t))}</span></div>
        <div class="field-row"><span>Current stop</span><span class="v">${FSTOPS[t-1]}</span></div>
        <div class="field-row"><span>Group size</span><span class="v">4 entrants</span></div>
        <div class="field-row"><span>Gross pot</span><span class="v">${fmt(grossPot(t))}</span></div>
        <div class="field-row"><span>House share (25%)</span><span class="v">${fmt(houseCut(t))}</span></div>
        <div class="field-row"><span>Net if you win</span><span class="v">${fmt(netAmount(t))}</span></div>
        ${state.excludeIds.length?`<div class="field-row"><span>Barred from your group</span><span class="v">${state.excludeIds.length} prev. contender${state.excludeIds.length>1?'s':''}</span></div>`:''}
        <button class="btn btn-primary btn-block" style="margin-top:20px" ${has?'':'disabled'} onclick="submitEntry()">
          ${retrying?`Play ${FSTOPS[t-1]} again`:`Pay ${fmt(stake(t))} and enter`}</button>
      </div>
    </div>

    <div class="devbar">
      <span style="color:var(--paper-dim)">demo controls — ties are 9.26% + 1.85% of rounds, so force one to see the flow:</span>
      <button class="btn btn-ghost btn-sm" onclick="setForce(null)">${state.forceTie===null?'▸ ':''}normal</button>
      <button class="btn btn-ghost btn-sm" onclick="setForce('2way')">${state.forceTie==='2way'?'▸ ':''}force 2-way tie</button>
      <button class="btn btn-ghost btn-sm" onclick="setForce('4way')">${state.forceTie==='4way'?'▸ ':''}force 4-way tie</button>
    </div>
  </div>`;
}
function setForce(v){ state.forceTie=v; render(); }
function handleUpload(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{state.player.photo=r.result;render();}; r.readAsDataURL(f);
}
function useSample(){
  const s=['tabletop-still','window-portrait','stairwell-shadow','rooftop-line','cafe-window'];
  state.player.photo=img(s[Math.floor(Math.random()*s.length)],600,800); render();
}
function submitEntry(){
  state.group=[state.player,...makeOpponents(GROUP_SIZE-1, state.excludeIds)];
  state.judging={ranks:{}}; setView('waiting');
}

function waitingView(){
  return `<div class="shell section" style="border-top:none;padding-top:44px;text-align:center">
    <span class="eyebrow">Tier ${state.tier} · ${FSTOPS[state.tier-1]} · pot building to ${fmt(grossPot(state.tier))}</span>
    <h2>Filling your group of four</h2>
    <div class="wait-grid">${state.group.map((_,i)=>`<div class="wait-slot" id="slot-${i}"><div class="pulse"></div></div>`).join('')}</div>
    <div class="wait-status" id="wait-status">Seating entrants…</div></div>`;
}
function runWaitingRoom(){
  state.group.forEach((m,i)=>{
    setTimeout(()=>{
      const el=document.getElementById('slot-'+i); if(!el) return;
      el.innerHTML=`<img src="${m.photo}" alt=""/><div class="tag">${i===0?'you':m.handle}</div>`;
      const st=document.getElementById('wait-status');
      if(st) st.textContent=`${i+1} / ${GROUP_SIZE} seated`+(i===GROUP_SIZE-1?' — starting judging…':'');
      if(i===GROUP_SIZE-1) setTimeout(()=>setView('judging'),900);
    }, i*520+300);
  });
}

function judgingView(){
  const opps=state.group.filter(m=>m.id!=='you');
  const photos=opps.map(o=>{
    const r=state.judging.ranks[o.id];
    return `<div class="judge-photo ${r?'ranked':''}" onclick="tapRank('${o.id}')">
      <img src="${o.photo}" alt="Entrant photograph"/>
      ${r?`<div class="rank-badge">${r} · ${RANK_POINTS[r-1]}pt</div>`:`<div class="rank-hint">tap to rank</div>`}
    </div>`;
  }).join('');
  const done=Object.keys(state.judging.ranks).length===GROUP_SIZE-1;
  const spent=Object.values(state.judging.ranks).reduce((a,r)=>a+RANK_POINTS[r-1],0);
  return `<div class="shell section" style="border-top:none;padding-top:44px">
    <span class="eyebrow">Tier ${state.tier} · ${FSTOPS[state.tier-1]}</span>
    <h2>Rank these three frames</h2>
    <p style="font-family:var(--mono);font-size:12px;color:var(--fog);margin-top:10px">
      tap in order of preference · tap again to undo · 1st = ${RANK_POINTS[0]}pts · 2nd = ${RANK_POINTS[1]} · 3rd = ${RANK_POINTS[2]}</p>
    <div class="judge-grid">${photos}</div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <button class="btn btn-primary" ${done?'':'disabled'} onclick="submitRanking()">Submit ranking</button>
      <span style="font-family:var(--mono);font-size:12px;color:${spent===23?'var(--gold)':'var(--fog)'}">
        ballot spends ${spent} / 23 points</span>
    </div></div>`;
}
function tapRank(id){
  if(state.judging.ranks[id]) delete state.judging.ranks[id];
  else{
    const used=Object.values(state.judging.ranks);
    const next=[1,2,3].find(r=>!used.includes(r));
    if(next) state.judging.ranks[id]=next;
  }
  render();
}
function submitRanking(){
  state.results=tallyRound(state.group, state.judging.ranks, state.forceTie);
  setView('results');
}

function resultsView(){
  const {scored,tiedIds,winnerId,outcome,total,balanced}=state.results;
  const t=state.tier, s=stake(t);
  const youTied = tiedIds.includes('you');

  const cards=scored.map(m=>{
    const isWin=m.id===winnerId;
    const isTied=outcome!=='decided' && tiedIds.includes(m.id);
    const dropped=outcome!=='decided' && !tiedIds.includes(m.id);
    let mark='';
    if(isWin) mark='<span class="crown">&#9733; winner</span>';
    else if(isTied) mark='<span class="tiemark">tied</span>';
    else if(dropped) mark='<span>dropped</span>';
    return `<div class="result-card ${isWin?'winner':''} ${isTied?'tied':''} ${dropped?'dropped':''}">
      <img src="${m.photo}" alt=""/>
      <div class="result-name"><span>${m.id==='you'?'you':m.handle}</span>${mark}</div>
      <div class="score-track"><div class="score-fill" data-pct="${Math.round(m.score/MAX_SCORE*100)}"></div></div>
      <div class="score-num">${m.score} pts</div>
      <div class="score-sub">${asFraction(m.score)} × base · ${m.score}/${MAX_SCORE}</div>
    </div>`;
  }).join('');

  const checksum = `<div class="checksum ${balanced?'':'bad'}">
    totals ${scored.map(x=>x.score).join(' + ')} = ${total} ${balanced?`&#10003; balances to ${ROUND_TOTAL}`:`&#10007; expected ${ROUND_TOTAL}`}</div>`;

  let potCard, bottom;

  if(outcome==='decided'){
    potCard=`<div class="card">
      <div class="pot-row"><span>Gross pot · ${GROUP_SIZE} × ${fmt(s)}</span><span>${fmt(grossPot(t))}</span></div>
      <div class="pot-row"><span>House share (25%)</span><span class="neg">&minus;${fmt(houseCut(t))}</span></div>
      <div class="pot-row"><span>${winnerId==='you'?'Your winnings':'Round winner takes'}</span><span>${fmt(netAmount(t))}</span></div>
    </div>`;
    const next=t+1, can=next<=MAX_TIER;
    bottom = winnerId==='you' ? `
      <div class="decision-panel">
        <div class="decision-card">
          <span class="eyebrow">Cash out</span><h3>Keep what you've earned</h3>
          <div class="amt">${fmt(netAmount(t))}</div>
          <p>Locked in, no further risk. It lands in your history and — at ${FSTOPS[3]} or above — the Hall of Fame gallery.</p>
          <button class="btn btn-gold btn-block" style="margin-top:16px" onclick="cashOut()">Cash out ${fmt(netAmount(t))}</button>
        </div>
        <div class="decision-card">
          <span class="eyebrow">Advance</span>
          <h3>${can?`Push into ${FSTOPS[next-1]}`:'You\'ve topped the ladder'}</h3>
          <div class="amt">${can?fmt(netAmount(next)):fmt(netAmount(t))}</div>
          <p>${can?`Your ${fmt(netAmount(t))} joins three other winners' pots. Same photograph, higher stakes, no guarantees.`
                  :`${FSTOPS[MAX_TIER-1]} is the top stop. Cash out to close the run.`}</p>
          <button class="btn btn-primary btn-block" style="margin-top:16px" ${can?'':'disabled'} onclick="advance()">
            ${can?`Risk it for ${fmt(netAmount(next))}`:'No further stops'}</button>
        </div>
      </div>` : `
      <div class="card" style="margin-top:26px;text-align:center">
        <h3>This round goes to ${scored.find(x=>x.id===winnerId).handle}</h3>
        <p style="margin-top:8px">Your entry is out for this run. Your ${fmt(s)} is part of the pot that carried them forward.</p>
        <div class="hero-cta" style="justify-content:center;margin-top:18px">
          <button class="btn btn-primary" onclick="restart()">Enter again from f/1 — $1</button>
          <button class="btn btn-ghost" onclick="setView('home')">Back home</button>
        </div>
      </div>`;

  } else if(outcome==='void2'){
    const houseTake=2*s;
    const other=scored.find(x=>tiedIds.includes(x.id)&&x.id!=='you');
    potCard=`<div class="card">
      <div class="pot-row"><span>Gross pot · ${GROUP_SIZE} × ${fmt(s)}</span><span>${fmt(grossPot(t))}</span></div>
      <div class="pot-row"><span>House share on 2-way tie</span><span class="neg">&minus;${fmt(houseTake)}</span></div>
      <div class="pot-row"><span>Your own stake stays yours</span><span>${fmt(s)} each</span></div>
    </div>`;
    bottom = youTied ? `
      <div class="void-banner">
        <span class="eyebrow">Round void — two-way tie at ${scored[0].score} points</span>
        <h3>You finished level. Replay, or cash out now.</h3>
        <p style="margin-top:8px">Both totals came to exactly ${scored[0].score} — equal as whole numbers, so there is
        nothing to round apart. The two dropped entrants' stakes (${fmt(houseTake)}) go to the house; your own
        ${fmt(s)} stake is untouched by the void${other?`, and you won't face ${other.handle} again if you replay`:''} —
        cash it out now or carry it straight into a replay of ${FSTOPS[t-1]}.</p>
      </div>
      ${tieDecisionPanel(t, s)}` : `
      <div class="card" style="margin-top:26px;text-align:center">
        <h3>Round void — but you were dropped</h3>
        <p style="margin-top:8px">Two entrants finished level above you on ${scored[0].score} points. Your ${fmt(s)} entry goes to the house.</p>
        <div class="hero-cta" style="justify-content:center;margin-top:18px">
          <button class="btn btn-primary" onclick="restart()">Enter again from f/1 — $1</button>
          <button class="btn btn-ghost" onclick="setView('home')">Back home</button>
        </div>
      </div>`;

  } else {
    potCard=`<div class="card">
      <div class="pot-row"><span>Gross pot · ${GROUP_SIZE} × ${fmt(s)}</span><span>${fmt(grossPot(t))}</span></div>
      <div class="pot-row"><span>House share on a void</span><span>${fmt(0)}</span></div>
      <div class="pot-row sub"><span>Dropped entrants to fund the replay</span><span>none</span></div>
      <div class="pot-row"><span>All four stakes returned</span><span>${fmt(s)} each</span></div>
    </div>`;
    bottom=`<div class="void-banner">
      <span class="eyebrow">Round void — four-way tie at ${scored[0].score} points</span>
      <h3>All four finished level. The house absorbs it.</h3>
      <p style="margin-top:8px">Every entrant collected one 1st, one 2nd and one 3rd, so every total is
      ${RANK_POINTS[0]} + ${RANK_POINTS[1]} + ${RANK_POINTS[2]} = ${scored[0].score}. No scoring scheme can separate
      them — the sum is the same whatever the three values are. There are no dropped entrants to fund a replay,
      so the house returns all four stakes and takes no share. Your ${fmt(s)} is back — play the stop again, or
      keep it and stop here.</p>
    </div>
    ${tieDecisionPanel(t, s)}`;
  }

  const label = outcome==='decided' ? '' :
    (outcome==='void2' ? ' · round void, two-way tie' : ' · round void, four-way tie');
  const streak = state.voidStreak>0 ? ` · replay ${state.voidStreak}` : '';

  return `<div class="shell section" style="border-top:none;padding-top:44px">
    <span class="eyebrow">Tier ${t} · ${FSTOPS[t-1]}${label}${streak}</span>
    <h2>${outcome==='decided'?'Results are in':'No winner this round'}</h2>
    <div class="results-grid">${cards}</div>
    ${checksum}
    <div style="margin-top:20px">${potCard}</div>
    ${bottom}</div>`;
}

/* Tied entrant's choice: replay the stop, or take the stake as a final
   payout instead. `amount` is always exactly one stake at this tier
   (invariant 5) — on a two-way void it's the entrant's own stake, left
   untouched since the dropped pool now goes to the house; on a four-way
   void it's the stake returned outright. Same value either way, so the
   same panel serves both. */
function tieDecisionPanel(t, amount){
  const achieved = t - 1;                      // tier whose win this stake came from; 0 at f/1
  const cashLabel = achieved>=1
    ? `Keep your ${FSTOPS[achieved-1]} win`
    : `Take your entry back`;
  const cashNote = achieved>=1
    ? `This ${fmt(amount)} is what you won at ${FSTOPS[achieved-1]}. Cashing out now banks it and ends this run
       without risking it on a replay.`
    : `You haven't won anything yet — this just returns your ${fmt(amount)} entry fee. Cashing out ends the run
       with nothing risked further.`;
  return `<div class="decision-panel">
    <div class="decision-card">
      <span class="eyebrow">Cash out</span><h3>${cashLabel}</h3>
      <div class="amt">${fmt(amount)}</div>
      <p>${cashNote}</p>
      <button class="btn btn-gold btn-block" style="margin-top:16px" onclick="cashOutTie()">Cash out ${fmt(amount)}</button>
    </div>
    <div class="decision-card">
      <span class="eyebrow">Replay</span><h3>Play ${FSTOPS[t-1]} again</h3>
      <div class="amt">${fmt(amount)}</div>
      <p>Same photograph, same stake, fresh opponents. Your ladder position holds — this stop replays, it never
      drops you a stop.</p>
      <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="replay()">Replay — stake carried</button>
    </div>
  </div>`;
}

function replay(){
  const {tiedIds,outcome}=state.results;
  state.excludeIds=Array.from(new Set([...state.excludeIds,
    ...tiedIds.filter(id=>id!=='you'),
    ...(outcome==='void4' ? state.group.map(m=>m.id).filter(id=>id!=='you') : [])]));
  state.voidStreak++;
  state.history.unshift({tier:state.tier,amount:0,void:outcome,photo:state.player.photo,at:new Date()});
  state.results=null;
  state.group=[state.player,...makeOpponents(GROUP_SIZE-1,state.excludeIds)];
  state.judging={ranks:{}};
  setView('waiting');
}
function cashOut(){
  state.history.unshift({tier:state.tier,amount:netAmount(state.tier),photo:state.player.photo,at:new Date()});
  if(state.tier>=4) state.hallAdds.unshift({photo:state.player.photo,tier:state.tier,handle:state.player.handle});
  resetRun(); setView('profile');
}
/* Tied entrant cashes out instead of replaying. The payout is exactly one
   stake at the tied tier (invariant 5) — on a two-way void this is the
   entrant's own stake, untouched by the tie (the house takes the dropped
   pool instead); on a four-way void it's the stake returned outright.
   `achievedTier` (t-1) is the stop this money was actually won at, since
   the current tier's round never decided a winner. */
function cashOutTie(){
  const t = state.tier, amount = stake(t), achievedTier = t - 1;
  state.history.unshift({tier:achievedTier, tierOfTie:t, amount, tieCashout:true,
    photo:state.player.photo, at:new Date()});
  if(achievedTier>=4) state.hallAdds.unshift({photo:state.player.photo,tier:achievedTier,handle:state.player.handle});
  resetRun(); setView('profile');
}
function advance(){
  state.tier++; state.voidStreak=0; state.excludeIds=[];
  state.group=[state.player,...makeOpponents(GROUP_SIZE-1,[])];
  state.judging={ranks:{}}; state.results=null; setView('waiting');
}
function restart(){ resetRun(); setView('entry'); }
function resetRun(){ state.tier=1; state.results=null; state.excludeIds=[]; state.voidStreak=0; }

function profileView(){
  const wins=state.history.filter(h=>!h.void);
  const voids=state.history.filter(h=>h.void);
  const total=wins.reduce((s,h)=>s+h.amount,0);
  const best=wins.reduce((m,h)=>Math.max(m,h.tier),0);
  const rows=state.history.map(h=>{
    const label = h.void
      ? `Round void at ${FSTOPS[h.tier-1]} — ${h.void==='void4'?'four-way':'two-way'} tie`
      : h.tieCashout
        ? (h.tier>=1
            ? `Cashed out after a tie at ${FSTOPS[h.tierOfTie-1]} — kept your ${FSTOPS[h.tier-1]} win`
            : `Withdrew entry after a tie at ${FSTOPS[h.tierOfTie-1]}`)
        : `Cashed out at ${FSTOPS[h.tier-1]}`;
    return `<div class="history-row"><img src="${h.photo}" alt=""/>
      <div class="history-meta">
        <div>${label}</div>
        <div class="t2">${h.at.toLocaleDateString()} · ${h.at.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${h.void?' · stake carried, tier held':''}</div>
      </div>
      <div class="history-amt ${h.void?'void':''}">${h.void?'replayed':fmt(h.amount)}</div></div>`;
  }).join('');
  return `<div class="shell section" style="border-top:none;padding-top:44px">
    <span class="eyebrow">Your record</span><h2>My Snapstakes</h2>
    <div class="stat-row">
      <div class="stat"><div class="n">${fmt(total)}</div><div class="l">Total cashed out</div></div>
      <div class="stat"><div class="n">${best?FSTOPS[best-1]:'—'}</div><div class="l">Best stop reached</div></div>
      <div class="stat"><div class="n">${wins.length}</div><div class="l">Runs cashed</div></div>
      <div class="stat"><div class="n">${voids.length}</div><div class="l">Rounds replayed</div></div>
    </div>
    <div class="history-list">${state.history.length?rows:`<div class="empty-state" style="margin-top:20px">No entries yet — win a round and cash out to start your record here.</div>`}</div>
    <div class="hero-cta" style="margin-top:30px"><button class="btn btn-primary" onclick="setView('entry')">Enter a new photograph — $1</button></div></div>`;
}

render();
</script>
</body>
</html>
